[project]
name = "arenagame"
version = "0.1.0"
description = "Endless Arena: a fast free-for-all shooter on floating platforms, at arena.endlessmind.com"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "endlessmind",
]

[project.scripts]
arena-server = "arena_server.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/arena_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
endlessmind = { path = "../EveryGame/realm-py", editable = true }
